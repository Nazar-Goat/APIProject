[project]
name = "apiproject"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "beanie>=2.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "loguru>=0.7.3",
    "motor>=3.7.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.fastapi]
entrypoint = "src.main:app"